<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Message Received — Valaré</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: #060605;
      color: #b8b09e;
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 560px;
      animation: appear 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .rule {
      width: 40px;
      height: 1px;
      background: #b8945a;
      margin: 0 auto 36px;
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 300;
      color: #ede8de;
      letter-spacing: 0.08em;
      margin-bottom: 48px;
      display: block;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.2rem, 6vw, 3.2rem);
      font-weight: 300;
      color: #ede8de;
      line-height: 1.15;
      margin-bottom: 28px;
      letter-spacing: 0.01em;
    }

    p {
      font-size: 0.95rem;
      line-height: 1.85;
      color: #b8b09e;
      margin-bottom: 48px;
    }

    p em {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: #b8945a;
      font-size: 1.05em;
    }

    .btn {
      display: inline-block;
      font-family: 'Jost', sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-decoration: none;
      color: #060605;
      background: #b8945a;
      padding: 16px 44px;
      transition: background 0.3s ease, letter-spacing 0.3s ease;
    }
    .btn:hover {
      background: #d4ad72;
      letter-spacing: 0.27em;
    }

    footer {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.66rem;
      letter-spacing: 0.1em;
      color: #3e3c38;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="logo">Valaré</span>
    <div class="rule"></div>
    <h1>Your Message<br>Has Been Received</h1>
    <p>
      Every great project begins with a single conversation.<br>
      We'll be in touch shortly — <em>excellence is already en route.</em>
    </p>
    <a class="btn" href="index.html">Return to Homepage</a>
  </div>
  <footer>&copy; 2025 Valaré — All Rights Reserved</footer>
</body>
</html>
